<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Fortune Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#101018; --bg2:#1E1A2A; --ink:#F3EEE6; --mute:#95899F;
  --gold:#D1B98C; --gold-dim:#8c7c5c;
  --cream:#F6F0E3; --pink:#F0B9B2; --teal:#9ED5CE; --coral:#F4A896;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(ellipse 1400px 900px at 50% -20%,#1E1A2A,#101018 70%);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.12;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
img{display:block;max-width:100%}

#app{max-width:1200px;margin:0 auto;padding:12px 20px 24px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;margin-bottom:4px}
.brand{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.topR{display:flex;gap:8px;align-items:center}

/* buttons */
.iconBtn{background:transparent;border:1px solid rgba(209,185,140,.35);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--mute);padding:0;transition:all .25s}
.iconBtn:hover{border-color:var(--gold);color:var(--gold)}
.iconBtn[data-on="true"]{border-color:var(--gold);color:var(--gold)}
.iconBtn[data-on="true"] svg{filter:drop-shadow(0 0 8px rgba(209,185,140,.6))}
.iconBtn svg{width:18px;height:18px}
.ghost{background:transparent;border:1px solid rgba(209,185,140,.4);color:var(--mute);border-radius:999px;padding:8px 18px;font-weight:500;min-height:40px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;transition:all .25s}
.ghost:hover{color:var(--gold);border-color:var(--gold)}
.cta{background:var(--gold);color:#1a1510;border:0;border-radius:999px;padding:16px 42px;font-weight:600;font-size:16px;letter-spacing:.18em;text-transform:uppercase;min-height:56px;transition:all .3s;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);transform:translateX(-100%);transition:transform .7s}
.cta:hover::before{transform:translateX(100%)}
.cta:disabled{background:#3a3344;color:#6a6176;cursor:not-allowed}
.cta:disabled::before{display:none}
.cta.ghost-cta{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.cta.cta-photo{display:inline-flex;align-items:center;gap:12px;padding:14px 32px 14px 24px;font-size:15px}
.cta.cta-photo img{width:36px;height:36px;display:block;filter:brightness(.15)}
.cta.cta-photo::after{content:"";position:absolute;inset:-6px;border:1px solid rgba(209,185,140,.4);border-radius:999px;animation:camPulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes camPulse{0%,100%{opacity:0;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:8px 0;position:relative}

/* ambient star field (very subtle) */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5}

/* attract */
.hero{width:100%;text-align:center}
.hero h1{display:inline-block;font-family:'Cormorant Garamond',serif;font-size:clamp(20px,2.8vw,34px);font-weight:400;margin:0 auto;font-style:italic;color:var(--cream);line-height:1.2;white-space:nowrap;max-width:none}
@media(max-width:720px){.hero h1{white-space:normal;max-width:16ch}}
.hero p{font-size:clamp(14px,1.6vw,17px);color:var(--mute);margin:10px 0 0;letter-spacing:.04em;font-style:normal;transition:opacity .5s;min-height:1.5em}
.passiveHint{margin-top:14px;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:14px;letter-spacing:.06em;opacity:.7;animation:pulseP 3.4s ease-in-out infinite}

/* V26 Together Mode */
.peoplePick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:760px;width:100%;margin:8px 0}
@media(max-width:700px){.peoplePick{grid-template-columns:1fr;max-width:380px}}
.peopleBtn{background:rgba(243,238,230,.03);border:1px solid rgba(209,185,140,.3);border-radius:4px;padding:22px 18px;color:var(--ink);text-align:center;transition:all .25s;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:160px;justify-content:center}
.peopleBtn:hover{background:rgba(243,238,230,.07);border-color:var(--gold);transform:translateY(-3px)}
.peopleBtn[aria-pressed="true"]{background:rgba(209,185,140,.14);border-color:var(--gold);box-shadow:0 0 24px rgba(209,185,140,.3)}
.peopleBtn .peopleN{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:56px;color:var(--gold);line-height:1;margin-bottom:4px}
.peopleBtn .peopleLbl{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream)}
.peopleBtn .peopleHint{font-size:11px;color:var(--mute);letter-spacing:.04em}

.playerBadge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid var(--gold);border-radius:999px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);background:rgba(209,185,140,.08)}

.handoverCard{background:rgba(243,238,230,.03);border:1px solid var(--gold);border-radius:4px;padding:48px 36px;max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 0 40px rgba(209,185,140,.15)}
.handoverStep{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.handoverTitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(28px,4vw,42px);color:var(--cream);margin:0;line-height:1.15}
.handoverSub{color:var(--mute);font-size:15px;line-height:1.6;max-width:460px;margin:0}
.handoverDots{display:flex;gap:12px;margin-top:6px}
.handoverDots .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold);background:transparent;transition:all .3s}
.handoverDots .dot.done{background:var(--gold-dim);opacity:.45}
.handoverDots .dot.now{background:var(--gold);box-shadow:0 0 14px rgba(209,185,140,.65);animation:pulseP 2s ease-in-out infinite}
.handoverFinal{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--teal);font-size:15px;margin-top:4px}

.constellation{display:flex;flex-direction:column;gap:22px;width:100%;max-width:1200px}
.playerBlock{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid rgba(209,185,140,.18)}
.playerBlock:first-child{border-top:0;padding-top:0}
.playerBlockHd{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.playerBlockName{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:600}
.playerBlockTheme{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--cream);font-size:18px}

.sharedAdventure{background:rgba(209,185,140,.06);border:1px solid var(--gold);border-radius:4px;padding:22px 26px;max-width:1000px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sharedFutures{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:4px 0}
.sharedFuture{text-align:center;padding:0 10px}
.sfLbl{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:4px}
.sfTitle{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--cream);font-size:22px;line-height:1.1;margin-bottom:4px}
.sfPoem{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--teal);font-size:14px}

/* V26: Installation-frame attract screen — looks like the physical kiosk */
.attractMain{gap:14px;padding-top:4px}
.installFrame{
  position:relative;
  width:min(440px,86vw);
  aspect-ratio:600/1000;
  margin:0 auto;
  background:radial-gradient(ellipse at 50% 20%,#1b1430 0%,#0d0a18 70%);
  border-radius:50% 50% 0 0 / 28% 28% 0 0;
  box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(209,185,140,.08);
  overflow:hidden;
  cursor:pointer;
  transition:transform .35s ease, box-shadow .35s ease;
}
.installFrame:hover,.installFrame:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 36px 70px rgba(0,0,0,.65),inset 0 0 80px rgba(209,185,140,.14);
  outline:none;
}
.installFrame .archSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.installInner{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:14% 8% 6%;
  text-align:center;
}
.installTitleBlock{display:flex;flex-direction:column;align-items:center;gap:8px}
.installTitle{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;font-style:normal;
  font-size:clamp(18px,3.6vw,28px);
  color:var(--gold);
  letter-spacing:.12em;
  line-height:1.05;
  text-shadow:0 0 18px rgba(209,185,140,.4);
  margin:0;
}
.installSub{
  font-size:clamp(10px,1.4vw,12px);
  letter-spacing:.32em;
  color:var(--mute);
  text-transform:uppercase;
  min-height:1.2em;
}
.installFrame .heroCards{min-height:0;margin:0;gap:clamp(6px,1.4vw,14px)}
.installFrame .heroCards .ac{width:min(90px,15vw);box-shadow:0 14px 36px rgba(0,0,0,.6)}
.installHandBlock{display:flex;flex-direction:column;align-items:center;gap:6px}
.installHand{width:34px;height:34px;color:var(--gold);animation:handTap 1.8s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(209,185,140,.5))}
@keyframes handTap{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-3px) scale(1.06)}
}
.installInvite{
  font-size:clamp(10px,1.3vw,12px);
  letter-spacing:.28em;
  color:var(--cream);
  text-transform:uppercase;
  animation:invitePulse 2.4s ease-in-out infinite;
}
@keyframes invitePulse{0%,100%{opacity:.75}50%{opacity:1}}
.installFooter{
  font-size:10px;letter-spacing:.5em;color:var(--gold);
  text-transform:uppercase;margin-top:4px;opacity:.9;
}
@media(max-width:520px){
  .installFrame{width:min(360px,90vw)}
  .installInner{padding:16% 7% 6%}
}
@media(max-height:700px){
  .installFrame{aspect-ratio:600/900}
  .installInner{padding:12% 7% 5%}
}
@keyframes pulseP{50%{opacity:1}}
.hero .tag{display:inline-block;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.heroCards{display:flex;gap:clamp(16px,2.4vw,30px);justify-content:center;align-items:center;margin:10px 0 8px;perspective:1200px;position:relative;min-height:280px}
.hc{display:inline-block;transform-origin:center bottom;position:relative}
.hc1{transform:rotate(-10deg) translateY(10px)}
.hc2{transform:rotate(0deg) translateY(-20px) scale(1.1);z-index:3}
.hc3{transform:rotate(10deg) translateY(10px)}
.heroCards .ac{width:min(170px,26vw);aspect-ratio:2/3;border-radius:10px;border:1px solid var(--gold);background:url('images/back.jpg') center/cover,#1a1540;box-shadow:0 20px 50px rgba(0,0,0,.65);position:relative;overflow:hidden;animation:bob 3.8s ease-in-out infinite}
.hc1 .ac{animation-delay:.6s}
.hc2 .ac{animation:bob2 4s ease-in-out infinite}
.hc3 .ac{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* Shimmer light sweep */
.heroCards .ac::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 32%,rgba(243,238,230,.45) 50%,transparent 68%);transform:translateX(-130%) skewX(-20deg);animation:shimmer 5s ease-in-out infinite;pointer-events:none}
.hc1 .ac::before{animation-delay:0s}
.hc2 .ac::before{animation-delay:1.6s}
.hc3 .ac::before{animation-delay:3.2s}
@keyframes shimmer{0%,70%{transform:translateX(-130%) skewX(-20deg)}100%{transform:translateX(140%) skewX(-20deg)}}
/* Pass-by ghost card drifting across behind the trio */
.passby{position:absolute;top:50%;left:50%;width:min(130px,20vw);aspect-ratio:2/3;border-radius:9px;border:1px solid var(--gold);background:url('images/back.jpg') center/cover,#1a1540;transform:translate(-50%,-50%);opacity:0;animation:passby 9s ease-in-out infinite;z-index:0;filter:blur(.5px)}
.passby.p2{animation-delay:4.5s;width:min(100px,16vw)}
@keyframes passby{
  0%{transform:translate(calc(-50% - 480px),-50%) rotate(-30deg) scale(.55);opacity:0}
  10%{opacity:.42}
  48%{transform:translate(calc(-50% - 10px),calc(-50% - 20px)) rotate(-4deg) scale(.78);opacity:.5}
  55%{transform:translate(calc(-50% + 10px),calc(-50% - 20px)) rotate(4deg) scale(.78);opacity:.5}
  90%{opacity:.3}
  100%{transform:translate(calc(-50% + 480px),-50%) rotate(30deg) scale(.55);opacity:0}
}

/* interest page */
.sectionTitle{font-size:clamp(28px,4vw,44px);font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;color:var(--cream);margin-bottom:4px}
.sectionSub{color:var(--mute);font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:860px;width:100%}
@media(max-width:700px){.chips{grid-template-columns:repeat(2,1fr)}}
.chip{background:rgba(243,238,230,.03);border:1px solid rgba(209,185,140,.25);border-radius:3px;padding:16px 16px;text-align:left;transition:all .3s;position:relative;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.chip:hover{background:rgba(243,238,230,.06);border-color:var(--gold);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:rgba(209,185,140,.12);border-color:var(--gold)}
.chip .name{font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:var(--cream);line-height:1}
.chip .tag{font-size:10px;color:var(--mute);letter-spacing:.2em;text-transform:uppercase}

.seg{display:inline-flex;border:1px solid rgba(209,185,140,.35);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.2)}
.seg button{background:transparent;border:0;padding:12px 22px;min-height:44px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:all .25s}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1a1510}

/* Hidden Places subpath page */
.pathChoice{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:720px;width:100%}
@media(max-width:600px){.pathChoice{grid-template-columns:1fr}}
.pathCard{position:relative;background:rgba(243,238,230,.03);border:1px solid rgba(209,185,140,.25);border-radius:3px;padding:24px 20px;text-align:left;transition:all .3s;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;overflow:hidden;cursor:pointer}
.pathCard:hover{background:rgba(243,238,230,.06);border-color:var(--gold);transform:translateY(-2px)}
.pathCard .glyph{font-size:38px;color:var(--gold);line-height:1}
.pathCard h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--cream)}
.pathCard p{color:var(--mute);font-size:14px;line-height:1.6}
.pathCard .goBtn{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

/* Ring draw page */
.prompt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.3vw,26px);color:var(--cream);min-height:1.3em}
.prompt .cnt{color:var(--mute);font-size:13px;font-style:normal;letter-spacing:.2em;margin-left:10px}
.ring{position:relative;width:100%;height:340px;margin:0 auto;max-width:1100px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible;background:radial-gradient(ellipse at 50% 55%,rgba(209,185,140,.1),transparent 65%)}
.ring-perspective{position:absolute;inset:0;perspective:1300px;perspective-origin:50% 55%}
.ring-inner{position:absolute;top:50%;left:50%;width:0;height:0;transform-style:preserve-3d;transform:translate3d(-50%,-50%,0) rotateX(14deg) rotateY(var(--ring-rot,0deg));transition:transform .3s ease-out;will-change:transform}
.rc{position:absolute;top:0;left:0;width:100px;height:150px;margin:-75px 0 0 -50px;transform-style:preserve-3d;transform:rotateY(var(--card-ang,0deg)) translateZ(260px);backface-visibility:hidden;transition:opacity .5s,transform .7s cubic-bezier(.4,.1,.4,1)}
.rc .face{width:100%;height:100%;border-radius:7px;border:1px solid var(--gold);background:url('images/back.jpg') center/cover,#1a1540;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rc.focus .face{box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(209,185,140,.55),0 8px 24px rgba(0,0,0,.5);animation:focusPulse 2.2s ease-in-out infinite}
.rc.fist .face{box-shadow:0 0 0 3px var(--coral),0 0 44px rgba(244,168,150,.95),0 8px 24px rgba(0,0,0,.5);animation:none}
.rc.confirmed .face{animation:cardFlash .6s ease-out}
.rc.drawn{opacity:0;transform:rotateY(var(--card-ang,0deg)) translateZ(260px) translateY(340px) scale(.2)}
@keyframes focusPulse{
  0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 28px rgba(209,185,140,.45),0 8px 24px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 0 2px var(--gold),0 0 44px rgba(209,185,140,.8),0 8px 24px rgba(0,0,0,.5)}
}
@keyframes cardFlash{
  0%{box-shadow:0 0 0 4px #fff,0 0 60px rgba(255,255,255,.9),0 8px 24px rgba(0,0,0,.5);filter:brightness(1.4)}
  100%{box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(209,185,140,.4),0 8px 24px rgba(0,0,0,.5);filter:brightness(1)}
}
#fistRing{position:fixed;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--coral) calc(var(--fp,0)*360deg),rgba(255,255,255,.12) 0);display:none;place-items:center;pointer-events:none;z-index:58;transform:translate(-50%,-50%)}
#fistRing::before{content:"HOLD";position:absolute;font-size:9px;letter-spacing:.22em;color:var(--coral);font-weight:700;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.9)}
#fistRing::after{content:"";width:70px;height:70px;border-radius:50%;background:var(--bg)}
#fistRing.on{display:grid}
#fistRing.on::before{animation:holdPulse .5s ease-in-out infinite alternate}
@keyframes holdPulse{from{opacity:.7}to{opacity:1}}
/* Gesture-aimed button highlight (any screen) */
.gest-aim{outline:2px solid var(--coral)!important;outline-offset:4px!important;box-shadow:0 0 24px rgba(244,168,150,.35)!important;transition:outline .15s,box-shadow .15s}
.ring-badge{position:absolute;top:6px;left:50%;transform:translateX(-50%);color:var(--mute);padding:5px 16px;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;z-index:4;background:rgba(16,16,24,.6);border:1px solid rgba(209,185,140,.3);border-radius:999px}
.ring-badge b{color:var(--gold);margin-left:8px;font-weight:600}
.hint{color:var(--mute);font-size:13px;letter-spacing:.08em;min-height:1.4em}
/* Gesture guide — two icons side by side explaining open-hand and fist */
/* V25: gesture guide — now sits at the TOP of the draw page */
.ggGuide{display:inline-flex;gap:22px;align-items:center;padding:10px 24px;border:1px solid rgba(209,185,140,.45);border-radius:999px;background:rgba(16,16,24,.7);margin-bottom:4px;position:relative;z-index:3}
.ggGuide .ggLabel{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;padding-right:4px;border-right:1px solid rgba(209,185,140,.3);margin-right:4px}
.ggItem{display:inline-flex;gap:10px;align-items:center;color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ggItem svg{width:28px;height:28px;color:var(--gold);display:block}
.ggItem.pick svg{color:var(--coral)}
.ggItem.pick{color:var(--cream)}

function slotHTML(role,rd){

function updateSlots(){

/* V25: progressive disclosure — Level 1 (title + poem) always; Level 2 (short summary) always;
   Level 3 (full story + facts + CTA) collapsed by default, opens on tap. */
function cardPanel(role,rd,showImage){
  const c = rd[role];
  let facts = '', acts = '';
  if(role==='present' && c.place){
    facts = `<div class="meta">${esc(c.place)}</div>`;
    acts = c.mapUrl ? `<a class="btn" href="${esc(c.mapUrl)}" target="_blank" rel="noopener">View on map ↗</a>` : '';
  }
  if(role==='future'){
    const label = c.ctaLabel || 'Learn more';
    if(c.flyer){
      acts = `<button class="btn" data-act="toFlyer">View the flyer ↗</button>`;
    } else if(c.isLibraryCta){
      acts = `<button class="btn" data-act="toLibrary">${esc(label)} →</button>`;
    } else if(c.ctaUrl){
      acts = `<a class="btn" href="${esc(c.ctaUrl)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
    } else {
      acts = `<span class="btn off">${esc(label)} (link pending)</span>`;
    }
  }
  /* Short summary (Level 2) = first sentence of the English story */
  const short = c.en.split(/(?<=[.!?])\s+/)[0];
  const needsExpand = c.en.length > short.length + 2 || facts || acts;
  const imgTag = (showImage && c.image)
    ? `<img class="panelCard" src="${esc(c.image)}" alt="${esc(c.title)} card" loading="lazy">`
    : '';
  return `<div class="panel">
    ${imgTag}
    <div class="panelText">
    <div class="role">${esc(c.role)}</div>
    <h2>${esc(c.title)}</h2>
    <div class="poem">${esc(c.poem)}</div>
    <p>${esc(short)}</p>
    ${needsExpand ? `<details class="moreDetails"><summary>Explore more</summary>
      ${c.en.length > short.length + 2 ? `<p>${esc(c.en.slice(short.length).trim())}</p>` : ''}
      ${facts}
      <div class="linkRow">${acts}</div>
    </details>` : ''}
    </div>
  </div>`;
}

/* ---------- Click handling ---------- */
$app.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-act]'); if(!t) return;
  const a = t.dataset.act;
  if(a==='start'){ initParticles(); startMusic(); if(!gest.on && !gest.loading) toggleGesture(); go('people'); }
  else if(a==='confirmPeople'){
    /* V26: lock the player count, initialize the archive, send player 1 to interest */
    S.players = Array.from({length:S.people}, ()=>({interest:null,subpath:null,readingId:null,revealed:[],focus:null}));
    S.currentPlayer = 0;
    nextPlayerTurn();
    go('interest');
  }
  else if(a==='startNextPlayer'){
    /* V26: wipe the live fields and send the next player to interest */
    nextPlayerTurn();
    go('interest');
  }
  else if(a==='restart'){ reset(); }
  else if(a==='back'){
    if(S.screen==='draw'){ const i=INTERESTS.find(x=>x.id===S.interest); go(i && i.hasSubpath ? 'subpath' : 'interest'); }
    else if(S.screen==='subpath'){ go('interest'); }
    else if(S.screen==='result'){ go('draw'); }
    else if(S.screen==='souvenir'){ souv.captured = null; go(S.people>1 ? 'constellation' : 'result'); }
    else if(S.screen==='constellation'){ /* going back from constellation is messy; just restart */ reset(); }
    else if(S.screen==='explore'){ go('result'); }
    else if(S.screen==='library'){ go('explore'); }
    else if(S.screen==='flyer'){ go(S.prevScreen || 'result'); S.prevScreen = null; }
    else if(S.screen==='interest'){ /* interest after people picker: go back to people */ go('people'); }
    else if(S.screen==='people'){ go('attract'); }
    else { go('attract'); }
  }
  else if(t.dataset.int){ S.interest = t.dataset.int; render(); }
  else if(t.dataset.ppl){ S.people = +t.dataset.ppl; render(); }
  else if(t.dataset.sub){
    const i = INTERESTS.find(x=>x.id===S.interest);
    S.subpath = t.dataset.sub;
    S.readingId = t.dataset.sub==='mystical' ? i.mysticalReading : i.defaultReading;
    S.revealed = []; S.focus = null;
    go('draw');
  }
  else if(a==='toNextFromInterest'){
    const i = INTERESTS.find(x=>x.id===S.interest); if(!i) return;
    if(i.hasSubpath){ go('subpath'); }
    else { S.readingId = i.reading; S.revealed = []; S.focus = null; go('draw'); }
  }
  else if(a==='toResult'){
    /* V26: if multi-player, archive this draw and either hand over or go to constellation */
    if(S.people > 1){
      archiveCurrentPlayer();
      S.currentPlayer++;
      if(S.currentPlayer < S.people){
        go('handover');
      } else {
        history.replaceState(null,'','#/constellation');
        go('constellation');
      }
    } else {
      history.replaceState(null,'','#/result/'+S.readingId);
      go('result');
    }
  }
  else if(a==='toSouv'){ history.replaceState(null,'','#/souvenir/'+(S.readingId||'group')); go('souvenir'); }
  else if(a==='toExplore'){ history.replaceState(null,'','#/explore/'+S.readingId); go('explore'); }
  else if(a==='toLibrary'){ go('library'); }
  else if(a==='toFlyer'){ S.prevScreen = S.screen; go('flyer'); }
  else if(a==='backFromFlyer'){ go(S.prevScreen || 'result'); S.prevScreen = null; }
  else if(a==='startSnap'){ startSouvenirCountdown(); }
  else if(a==='retakeSouv'){ souv.captured = null; render(); setTimeout(initSouvenir, 50); }
  else if(a==='dlSouv'){ downloadSouvenir(t); }
  else if(a==='gest'){ toggleGesture(); }
  else if(a==='mute'){ toggleMusic(); }
  else if(a==='poster'){
    const area = document.getElementById('posterArea');
    const note = document.getElementById('note');
    if(!area){ if(note) note.textContent = 'Could not find the result area to render.'; return; }
    if(typeof html2canvas === 'undefined'){ if(note) note.textContent = 'Poster library did not load. Try again or check your connection.'; return; }
    if(note) note.textContent = 'Generating your poster…';
    t.disabled = true; t.textContent = 'Rendering…';
    html2canvas(area, { backgroundColor:'#101018', scale:2, useCORS:true, logging:false })
      .then(canvas=>{
        const link = document.createElement('a');
        link.download = 'lucky-fortune-wall-' + (S.readingId||'reading') + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        if(note) note.textContent = 'Poster saved to your downloads.';
      })
      .catch(e=>{ console.error('poster', e); if(note) note.textContent = 'Could not render the poster: ' + (e&&e.message||'unknown error'); })
      .finally(()=>{ t.disabled = false; t.textContent = 'Save as poster'; });
  }
});

/* ---------- Hash routing ---------- */
function fromHash(){
  const m = location.hash.match(/^#\/(result|explore|library)\/?([\w-]+)?/);
  if(!m) return;
  if(m[1]==='library'){ S.screen='library'; return; }
  if(m[2] && READINGS[m[2]]){
    const rd = READINGS[m[2]];
    S.readingId = m[2]; S.interest = rd.interest; S.subpath = rd.subpath || null;
    S.revealed = [...ROLES]; S.screen = m[1];
  }
}

/* ============================================================
   3D Fate Ring (full 360°)
   ============================================================ */
const RING = { N:15, rot:0, drawn:new Set(), locking:false, dragLast:null };
function cardAngle(i){ return i * (360 / RING.N); }
function focusIndex(){
  let best=-1,bestD=999;
  for(let i=0;i<RING.N;i++){
    if(RING.drawn.has(i)) continue;
    let a = (cardAngle(i) + RING.rot) % 360;
    if(a>180) a-=360; if(a<-180) a+=360;
    const d = Math.abs(a); if(d<bestD){ bestD=d; best=i; }
  }
  return best;
}
function buildRing(){
  const inner = document.getElementById('ringInner'); if(!inner) return;
  let html = '';
  for(let i=0;i<RING.N;i++) html += `<div class="rc" data-ring="${i}" style="--card-ang:${cardAngle(i)}deg"><div class="face"></div></div>`;
  inner.innerHTML = html;
  updateRing();
}
function updateRing(){
  const inner = document.getElementById('ringInner'); if(!inner) return;
  inner.style.setProperty('--ring-rot', RING.rot.toFixed(2)+'deg');
  const f = focusIndex();
  for(let i=0;i<RING.N;i++){
    const el = inner.children[i]; if(!el) continue;
    el.classList.toggle('focus', i===f);
    el.classList.toggle('drawn', RING.drawn.has(i));
  }
  const b = document.querySelector('.ring-badge b');
  if(b) b.textContent = S.revealed.length + '/3';
}
function rotateRing(deg){ if(RING.locking) return; RING.rot = (RING.rot + deg) % 360; updateRing(); }
function initRing(){
  RING.drawn = new Set(); RING.rot = 0; RING.locking = false;
  buildRing(); updateSlots();
  const ring = document.getElementById('ring'); if(!ring) return;
  ring.addEventListener('pointerdown', e=>{ RING.dragLast={x:e.clientX,y:e.clientY}; ring.setPointerCapture(e.pointerId); });
  ring.addEventListener('pointermove', e=>{
    if(!RING.dragLast) return;
    const dx = e.clientX - RING.dragLast.x;
    RING.dragLast = {x:e.clientX,y:e.clientY};
    rotateRing(dx*0.4);
  });
  const endDrag = ()=>{ RING.dragLast=null; };
  ring.addEventListener('pointerup', endDrag);
  ring.addEventListener('pointercancel', endDrag);
  ring.addEventListener('click', e=>{
    const el = e.target.closest('.rc'); if(!el || el.classList.contains('drawn')) return;
    const i = +el.dataset.ring;
    if(i===focusIndex()) drawFocusCard();
    else { RING.rot = -cardAngle(i); updateRing(); }
  });
}
function drawFocusCard(){
  if(RING.locking) return;
  const i = focusIndex(); if(i<0) return;
  const role = ROLES[S.revealed.length]; if(!role) return;
  RING.locking = true;
  const ring = document.getElementById('ring');
  if(ring){
    const r = ring.getBoundingClientRect();
    particleBurst(r.left + r.width/2, r.top + r.height*0.5, 70);
  }
  /* V25: brief "Confirmed" flash on the focused card so the pick is unmistakable */
  const inner = document.getElementById('ringInner');
  if(inner && inner.children[i]){
    const el = inner.children[i];
    el.classList.remove('fist');
    el.classList.add('confirmed');
    setTimeout(()=>el.classList.remove('confirmed'), 650);
  }
  RING.drawn.add(i);
  S.revealed.push(role); S.focus = role;
  updateRing(); updateSlots(); updatePromptAndCta();
  setTimeout(()=>{ RING.locking = false; }, 900);
}

/* ============================================================
   Gesture: MediaPipe HandLandmarker + circle detection
   ============================================================ */
const gest = { on:false, loading:false, stream:null, lm:null, raf:0, lastTs:0 };
function setStat(msg, sticky){
  const el = document.getElementById('geststat'); if(!el) return;
  clearTimeout(gest.statT);
  if(msg){ el.textContent = msg; el.classList.add('on'); if(!sticky) gest.statT = setTimeout(()=>el.classList.remove('on'), 5000); }
  else el.classList.remove('on');
}
async function toggleGesture(){
  if(gest.loading) return;
  if(gest.on){ disableGesture(); return; }
  gest.loading = true; render(); setStat('Loading hand model… first time takes a few seconds.', true);
  try {
    if(!gest.lm){
      const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm');
      const fs = await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      gest.lm = await mod.HandLandmarker.createFromOptions(fs, {
        baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
        numHands:1, runningMode:'VIDEO'
      });
    }
    setStat('Requesting camera…', true);
    gest.stream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480,facingMode:'user'}, audio:false });
    const v = document.getElementById('gestvid');
    v.srcObject = gest.stream; await v.play(); v.classList.add('on');
    gest.on = true; gest.loading = false;
    setStat('Draw a circle in the air to spin the ring. Make a fist to pick the front card.');
    render(); updateGestVisibility(); runGestLoop();
  } catch(e){
    gest.loading = false;
    const msg = (e && e.name==='NotAllowedError') ? 'Camera access denied. Use touch instead.' : ('Camera unavailable: '+(e&&e.message||'error')+'. Use touch instead.');
    setStat(msg); render();
  }
}
function disableGesture(silent){
  const was = gest.on; gest.on = false;
  cancelAnimationFrame(gest.raf);
  if(gest.stream){ gest.stream.getTracks().forEach(t=>t.stop()); gest.stream = null; }
  const v = document.getElementById('gestvid'); if(v){ v.srcObject=null; v.classList.remove('on'); }
  const c = document.getElementById('gestcur'); if(c) c.classList.remove('on');
  circleG.pts.length = 0; fistReset();
  if(was && !silent) setStat('Camera off.');
  render();
}
function runGestLoop(){
  if(!gest.on) return;
  const v = document.getElementById('gestvid');
  if(v && v.readyState>=2 && gest.lm){
    const ts = performance.now();
    if(ts - gest.lastTs > 50){ gest.lastTs = ts;
      try {
        const res = gest.lm.detectForVideo(v, ts);
        if(res && res.landmarks && res.landmarks[0]){
          const lm = res.landmarks[0];
          const tip = lm[8];
          // Cursor position: index finger tip when open, middle MCP when closed (stable centre)
          const fist = isFist(lm);
          const anchor = fist ? lm[9] : tip;
          const x = (1-anchor.x) * window.innerWidth;
          const y = anchor.y * window.innerHeight;
          showCursor(x, y, fist);
          // Gesture: draw-page uses fist to pick card; result-page uses peace sign to capture
          if(S.screen === 'draw'){
            fistStep(fist, x, y);
            if(!fist) circleStep(x, y);
            else circleG.pts.length = 0;
          } else if(S.screen === 'souvenir' && !souv.captured && !souv.countdown){
            if(isPeaceSign(res.landmarks[0])) startSouvenirCountdown();
          } else {
            circleG.pts.length = 0; fistReset();
          }
        } else {
          hideCursor(); circleG.pts.length = 0; fistReset();
        }
      } catch(e){}
    }
  }
  gest.raf = requestAnimationFrame(runGestLoop);
}
function showCursor(x,y,fist){
  const c = document.getElementById('gestcur'); if(!c) return;
  // Only show cursor on the draw screen
  if(S.screen !== 'draw'){ c.classList.remove('on'); return; }
  c.classList.add('on'); c.style.left=x+'px'; c.style.top=y+'px';
  c.style.borderColor = fist ? 'var(--coral)' : 'var(--gold)';
  c.style.background = fist ? 'rgba(244,168,150,.5)' : 'rgba(209,185,140,.35)';
  if(!fist && Math.random()<0.35) particleSpawn(x,y,1,'trail');
}
function hideCursor(){
  const c = document.getElementById('gestcur'); if(c) c.classList.remove('on');
  const prev = document.querySelector('.gest-aim'); if(prev) prev.classList.remove('gest-aim');
}

/* Fist detection:
   Compare each curled fingertip's distance to the wrist against hand size
   (wrist→index-MCP). Open fingers extend 1.9+ hand-sizes from wrist;
   curled fingers sit ≤1.5 hand-sizes. At least 3 of 4 curled = fist. */
/* Fist detection — robust to hand orientation.
   For each finger (index, middle, ring, pinky), compare the fingertip's
   distance to the wrist against the middle-knuckle (PIP)'s distance to
   the wrist. An EXTENDED finger has its tip farther from the wrist than
   the PIP (tip ≈ 1.5–2× PIP). A CURLED finger has the tip at or inside
   the PIP's distance (ratio ≤ 1.1). All four must be curled to count as
   a fist — tightest practical threshold that still works at any hand
   angle. */
function isFist(lm){
  const w = lm[0];
  const tipI = [8, 12, 16, 20];
  const pipI = [6, 10, 14, 18];
  let curled = 0;
  for(let i=0; i<4; i++){
    const tip = lm[tipI[i]], pip = lm[pipI[i]];
    const dTip = Math.hypot(tip.x - w.x, tip.y - w.y);
    const dPip = Math.hypot(pip.x - w.x, pip.y - w.y);
    if(dTip < dPip * 1.1) curled++;
  }
  return curled >= 4;
}

/* Fist gesture → pick focus card. 280 ms hold prevents accidental trigger.
   Once triggered, hand must OPEN (curled < 2) before next fist is accepted. */
const fist = { startT:0, armed:true, lastX:0, lastY:0 };
const FIST_HOLD_MS = 280;
function fistStep(isF, x, y){
  const now = performance.now();
  const ring = document.getElementById('fistRing');
  fist.lastX = x; fist.lastY = y;
  if(isF){
    if(!fist.startT) fist.startT = now;
    const p = Math.min(1, (now - fist.startT) / FIST_HOLD_MS);
    if(ring){
      ring.classList.add('on');
      ring.style.left = x+'px'; ring.style.top = y+'px';
      ring.style.setProperty('--fp', p);
    }
    // show "fist" state on the focus card
    const inner = document.getElementById('ringInner');
    if(inner){
      const f = focusIndex();
      for(let i=0;i<RING.N;i++){
        const el = inner.children[i]; if(!el) continue;
        el.classList.toggle('fist', i === f);
      }
    }
    if(p >= 1 && fist.armed && !RING.locking){
      fist.armed = false;
      if(ring) ring.classList.remove('on');
      particleBurst(x, y, 50);
      if(S.screen === 'draw'){
        drawFocusCard();
      } else {
        // Click whatever button is under the cursor
        const el = document.elementFromPoint(x, y);
        const btn = (el && el.closest) ? el.closest('button,a.btn') : null;
        if(btn && !btn.disabled) btn.click();
      }
    }
  } else {
    // Hand opened → reset progress; re-arm after a short grace
    fist.startT = 0;
    fist.armed = true;
    if(ring){ ring.classList.remove('on'); ring.style.setProperty('--fp', 0); }
    const inner = document.getElementById('ringInner');
    if(inner) for(let i=0;i<RING.N;i++){ const el = inner.children[i]; if(el) el.classList.remove('fist'); }
  }
}
/* How many fingers are curled right now (0-4). Used for the open-hand check. */
function curledCount(lm){
  const w = lm[0];
  const tipI = [8, 12, 16, 20];
  const pipI = [6, 10, 14, 18];
  let c = 0;
  for(let i=0;i<4;i++){
    const dTip = Math.hypot(lm[tipI[i]].x - w.x, lm[tipI[i]].y - w.y);
    const dPip = Math.hypot(lm[pipI[i]].x - w.x, lm[pipI[i]].y - w.y);
    if(dTip < dPip * 1.1) c++;
  }
  return c;
}
/* Peace sign ✌️ — index + middle extended; ring + pinky curled.
   Separate ratios for "clearly extended" vs "clearly curled" so a
   lazy ring finger still counts and a half-open index still extends. */
function isPeaceSign(lm){
  const w = lm[0];
  const tipI = [8, 12, 16, 20];
  const pipI = [6, 10, 14, 18];
  const ratio = i => {
    const dTip = Math.hypot(lm[tipI[i]].x - w.x, lm[tipI[i]].y - w.y);
    const dPip = Math.hypot(lm[pipI[i]].x - w.x, lm[pipI[i]].y - w.y);
    return dTip / dPip;
  };
  const ext = i => ratio(i) > 1.08;   // extended if tip is noticeably farther than PIP
  const cur = i => ratio(i) < 1.35;   // curled if tip is NOT much farther (lenient so ring finger counts)
  // Index + middle extended, ring + pinky NOT fully extended
  return ext(0) && ext(1) && cur(2) && cur(3);
}
function fistReset(){
  fist.startT = 0; fist.armed = true;
  const ring = document.getElementById('fistRing');
  if(ring){ ring.classList.remove('on'); ring.style.setProperty('--fp', 0); }
  const inner = document.getElementById('ringInner');
  if(inner) for(let i=0;i<RING.N;i++){ const el = inner.children[i]; if(el) el.classList.remove('fist'); }
}

/* Circle gesture — spin the ring (only runs when hand is open) */
const circleG = { pts:[] };
function circleStep(x,y){
  const now = performance.now();
  circleG.pts.push({x,y,t:now});
  while(circleG.pts.length && now - circleG.pts[0].t > 450) circleG.pts.shift();
  if(circleG.pts.length < 3) return;
  const n = circleG.pts.length;
  const p1 = circleG.pts[n-2], p2 = circleG.pts[n-1];
  const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  if(dist < 2.5) return;
  let cx=0, cy=0; for(const p of circleG.pts){ cx+=p.x; cy+=p.y; } cx/=n; cy/=n;
  const r2 = (p2.x-cx)**2 + (p2.y-cy)**2;
  if(r2 < 625) return;  // 25px min radius
  const a1 = Math.atan2(p1.y-cy, p1.x-cx);
  const a2 = Math.atan2(p2.y-cy, p2.x-cx);
  let dA = a2 - a1;
  if(dA > Math.PI) dA -= 2*Math.PI;
  if(dA < -Math.PI) dA += 2*Math.PI;
  rotateRing(-(dA*180/Math.PI)*1.4);
}

/* ============================================================
   Souvenir — selfie + fortune reading composite poster
   ============================================================ */
async function initSouvenir(){
  const v = document.getElementById('selfVid'); if(!v) return;
  try {
    if(!gest.stream){
      gest.stream = await navigator.mediaDevices.getUserMedia({ video:{ width:720, height:960, facingMode:'user' }, audio:false });
    }
    v.srcObject = gest.stream;
    await v.play();
  } catch(e){
    const n = document.getElementById('note');
    if(n) n.textContent = 'Camera is needed to take a photo. ' + (e.name==='NotAllowedError'?'Please allow the camera.':(e.message||''));
  }
}
function startSouvenirCountdown(){
  if(souv.countdown) return;
  const cd = document.getElementById('cdown'); if(!cd) return;
  let n = 3; cd.textContent = n;
  souv.countdown = setInterval(()=>{
    n--;
    if(n > 0){ cd.textContent = n; }
    else {
      clearInterval(souv.countdown); souv.countdown = null;
      cd.textContent = '';
      cd.classList.add('flash');
      setTimeout(()=>cd.classList.remove('flash'), 600);
      takeSouvenirSnap();
    }
  }, 1000);
}
function takeSouvenirSnap(){
  const v = document.getElementById('selfVid'); if(!v){ return; }
  const w = v.videoWidth || 720, h = v.videoHeight || 960;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  // Un-mirror (video is CSS-mirrored for the user, but we want the snapshot un-mirrored for sharing)
  ctx.translate(w, 0); ctx.scale(-1, 1);
  ctx.drawImage(v, 0, 0, w, h);
  souv.captured = c.toDataURL('image/jpeg', 0.9);
  render();
}
async function downloadSouvenir(btn){
  const el = document.getElementById('souvPoster');
  const note = document.getElementById('note');
  if(!el){ if(note) note.textContent = 'Souvenir not ready.'; return; }
  if(typeof html2canvas === 'undefined'){ if(note) note.textContent = 'Download library not loaded. Check your connection.'; return; }
  if(note) note.textContent = 'Rendering your souvenir…';
  if(btn){ btn.disabled = true; btn.textContent = 'Rendering…'; }
  try {
    const canvas = await html2canvas(el, { backgroundColor:null, scale:2, useCORS:true, logging:false });
    const link = document.createElement('a');
    link.download = 'newtown-souvenir-' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    if(note) note.textContent = 'Saved to your downloads.';
  } catch(e){
    console.error('souvenir', e);
    if(note) note.textContent = 'Could not save: ' + (e&&e.message||'unknown error');
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Save to your device'; }
}

/* ============================================================
   Gold-dust particles
   ============================================================ */
const PCANV = { ctx:null, parts:[], raf:0, w:0, h:0 };
function initParticles(){
  const c = document.getElementById('particles'); if(!c) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const resize = ()=>{
    PCANV.w = window.innerWidth; PCANV.h = window.innerHeight;
    c.width = PCANV.w*dpr; c.height = PCANV.h*dpr;
    c.style.width = PCANV.w+'px'; c.style.height = PCANV.h+'px';
    PCANV.ctx = c.getContext('2d'); PCANV.ctx.scale(dpr,dpr);
  };
  resize(); window.addEventListener('resize', resize);
  if(!PCANV.raf) renderParticles();
}
function particleSpawn(x,y,n,type){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = type==='trail' ? Math.random()*0.6 : Math.random()*4+1;
    PCANV.parts.push({
      x:x+(Math.random()-0.5)*6, y:y+(Math.random()-0.5)*6,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (type==='trail'?0.2:0.6),
      life:1, decay:type==='trail'?0.025:0.012,
      size:1+Math.random()*(type==='trail'?1.6:3),
      color:Math.random()<0.88?'#D1B98C':(Math.random()<0.5?'#9ED5CE':'#F0B9B2'),
    });
  }
  if(PCANV.parts.length>500) PCANV.parts.splice(0, PCANV.parts.length-500);
}
function particleBurst(x,y,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = Math.random()*8+2;
    PCANV.parts.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
      life:1, decay:0.011, size:1+Math.random()*3.5,
      color:Math.random()<0.85?'#D1B98C':(Math.random()<0.5?'#F0B9B2':'#9ED5CE'),
    });
  }
}
function renderParticles(){
  const ctx = PCANV.ctx;
  if(!ctx){ PCANV.raf = requestAnimationFrame(renderParticles); return; }
  ctx.clearRect(0,0,PCANV.w,PCANV.h);
  for(let i=PCANV.parts.length-1;i>=0;i--){
    const p = PCANV.parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.vx*=0.99; p.life-=p.decay;
    if(p.life<=0){ PCANV.parts.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  PCANV.raf = requestAnimationFrame(renderParticles);
}

/* ============================================================
   Background music: HTMLAudioElement loop with fade in/out
   ============================================================ */
const audio = { el:null, on:false, fadeI:null, targetVol:0.3 };
function ensureAudio(){
  if(audio.el) return audio.el;
  const el = new Audio('audio/musicbox.mp3');
  el.loop = true; el.preload = 'auto'; el.volume = 0;
  el.addEventListener('error', ()=>{ setStat('Could not load music file.'); audio.on=false; try{render();}catch(e){} });
  audio.el = el; return el;
}
function fadeTo(target, dur, done){
  if(audio.fadeI){ clearInterval(audio.fadeI); audio.fadeI = null; }
  if(!audio.el){ if(done) done(); return; }
  const start = audio.el.volume, t0 = performance.now();
  audio.fadeI = setInterval(()=>{
    const t = Math.min(1,(performance.now()-t0)/dur);
    try{ audio.el.volume = Math.max(0,Math.min(1, start+(target-start)*t)); }catch(e){}
    if(t>=1){ clearInterval(audio.fadeI); audio.fadeI=null; if(done) done(); }
  }, 40);
}
function startMusic(){
  try {
    const el = ensureAudio(); el.volume = 0;
    const p = el.play();
    if(p && p.catch) p.catch(e=>{ setStat('Audio blocked by the browser. Tap ♪ again.'); });
    fadeTo(audio.targetVol, 1500);
    audio.on = true; render();
  } catch(e){ setStat('Audio failed to start.'); }
}
function stopMusic(){
  audio.on = false;
  if(!audio.el){ try{render();}catch(e){} return; }
  fadeTo(0, 700, ()=>{ try{ audio.el.pause(); }catch(e){} });
  try{render();}catch(e){}
}
function toggleMusic(){ if(audio.on) stopMusic(); else startMusic(); }

/* ============================================================
   Ambient background stars (very subtle, static)
   ============================================================ */
function buildStars(){
  const g = document.getElementById('starG'); if(!g) return;
  const svg = g.ownerSVGElement; svg.setAttribute('width',window.innerWidth); svg.setAttribute('height',window.innerHeight);
  let s = '';
  const N = 90;
  for(let i=0;i<N;i++){
    const x = Math.random()*window.innerWidth;
    const y = Math.random()*window.innerHeight;
    const r = Math.random()*1.1 + 0.3;
    const o = Math.random()*0.55 + 0.1;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#D1B98C" opacity="${o.toFixed(2)}"/>`;
  }
  g.innerHTML = s;
}
window.addEventListener('resize', buildStars);

/* ---------- Clean-up on unload / tab hidden ---------- */
window.addEventListener('beforeunload', ()=>{ disableGesture(true); stopMusic(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && gest.on) disableGesture(true); });

/* ---------- Error surface (so page never silently white-screens) ---------- */
window.addEventListener('error', ev=>{
  const el = document.getElementById('geststat'); if(!el) return;
  el.textContent = 'JS error: '+(ev.message||'unknown')+' — '+(ev.filename||'')+':'+(ev.lineno||'');
  el.classList.add('on');
});

/* ---------- Boot ---------- */
try { buildStars(); } catch(e){}
try { fromHash(); } catch(e){}
try { initParticles(); } catch(e){}
try { render(); } catch(e){
  console.error(e);
  document.getElementById('app').innerHTML = '<div style="padding:40px;max-width:600px;margin:40px auto;background:#1E1A2A;border:1px solid #D1B98C;border-radius:4px"><h2 style="font-family:Georgia,serif;color:#D1B98C;margin:0 0 12px">Something went wrong.</h2><p>'+String(e&&e.message||e)+'</p></div>';
}
</script>
